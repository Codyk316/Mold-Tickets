<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polytech Mold Ticket Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2435;
    --border: #2a3050;
    --accent: #cc1a1a;
    --accent2: #e83c3c;
    --green: #22c55e;
    --text: #e8eaf0;
    --muted: #7a8099;
    --red-field: #2d0a0a;
    --red-field-border: #cc1a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  .header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .header-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    border-left: 1px solid var(--border);
    padding-left: 16px;
    margin-left: 4px;
  }

  .main {
    display: grid;
    grid-template-columns: 420px 1fr;
    min-height: calc(100vh - 65px);
  }

  .form-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    overflow-y: auto;
  }

  .ticket-panel {
    padding: 28px 32px;
    background: var(--bg);
  }

  .section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .form-section {
    margin-bottom: 28px;
  }

  .field-group {
    display: grid;
    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .field input, .field select {
    background: var(--red-field);
    border: 1px solid var(--red-field-border);
    color: var(--text);
    padding: 9px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }

  .field input:focus, .field select:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(204, 26, 26, 0.15);
  }

  .field select option {
    background: #1e1e2e;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .field-row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field input[readonly] {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--green);
    cursor: default;
  }

  .generate-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
  }

  .generate-btn:hover { background: #a81515; }
  .generate-btn:active { transform: scale(0.98); }

  .print-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .print-btn:hover { color: var(--text); border-color: var(--muted); }

  /* ── TICKET ── */
  .ticket-wrapper {
    max-width: 680px;
  }

  .ticket-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .ticket {
    background: #fff;
    color: #111;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .ticket-header {
    background: #1a1a2e;
    color: #fff;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .ticket-company {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #cc1a1a;
    text-transform: uppercase;
  }

  .ticket-subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: #7a8099;
    margin-top: 3px;
    text-transform: uppercase;
  }

  .ticket-id-block {
    text-align: right;
  }

  .ticket-id-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: #7a8099;
    text-transform: uppercase;
  }

  .ticket-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    color: #e83c3c;
    margin-top: 2px;
  }

  .ticket-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #7a8099;
    margin-top: 4px;
  }

  .ticket-banner {
    background: #cc1a1a;
    padding: 8px 28px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #fff;
    font-weight: 600;
  }

  .ticket-body {
    padding: 24px 28px;
    display: grid;
    gap: 18px;
  }

  .ticket-section-header {
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7a8099;
    border-bottom: 1px solid #e0e0e0;
    padding-bottom: 5px;
    margin-bottom: 10px;
  }

  .ticket-grid3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }

  .ticket-grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .t-field label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #888;
    display: block;
    margin-bottom: 3px;
  }

  .t-field .t-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    color: #1a1a2e;
    background: #f5f7ff;
    padding: 6px 10px;
    border-radius: 4px;
    border-left: 3px solid #cc1a1a;
  }

  .t-field .t-value.highlight {
    background: #fde8e8;
    border-left-color: #e83c3c;
    font-size: 18px;
  }

  .t-field .t-value.green {
    background: #f0fdf4;
    border-left-color: #22c55e;
    color: #166534;
    font-size: 18px;
  }

  .ticket-material-block {
    background: #1a1a2e;
    border-radius: 6px;
    padding: 16px 20px;
    color: #fff;
  }

  .material-name {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #e83c3c;
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-top: 6px;
  }

  .material-weight-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 36px;
    font-weight: 500;
    color: #22c55e;
    line-height: 1;
  }

  .material-weight-unit {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: #7a8099;
  }

  .material-weight-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7a8099;
    margin-top: 2px;
  }

  .pressure-table {
    width: 100%;
    border-collapse: collapse;
  }

  .pressure-table th {
    background: #1a1a2e;
    color: #7a8099;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 7px 10px;
    text-align: left;
  }

  .pressure-table td {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 7px 10px;
    border-bottom: 1px solid #f0f0f0;
    color: #1a1a2e;
  }

  .pressure-table tr.highlighted td {
    background: #fde8e8;
    font-weight: 600;
    color: #991111;
  }

  .pressure-table tr.highlighted td:first-child {
    border-left: 3px solid #cc1a1a;
  }

  .ticket-footer {
    background: #f5f5f5;
    border-top: 1px solid #e0e0e0;
    padding: 12px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-op {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #888;
    letter-spacing: 1px;
  }

  .footer-sig {
    display: flex;
    gap: 32px;
  }

  .sig-line {
    text-align: center;
  }

  .sig-underline {
    width: 100px;
    border-bottom: 1px solid #999;
    height: 20px;
    margin-bottom: 4px;
  }

  .sig-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #888;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 400px;
    color: var(--muted);
    text-align: center;
    gap: 12px;
  }

  .empty-icon {
    font-size: 48px;
    opacity: 0.3;
  }

  .empty-text {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 13px;
  }

  .hint {
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 6px;
    padding: 6px 10px;
    background: var(--surface2);
    border-radius: 4px;
    border-left: 2px solid var(--accent2);
  }

  @media print {
    body { background: #fff; }
    .form-panel, .header { display: none; }
    .main { display: block; }
    .ticket-panel { padding: 0; }
    .ticket-label { display: none; }
    .print-btn, .generate-btn { display: none; }
    .ticket { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">Polytech</div>
  <div class="header-sub">Mold Ticket Generator</div>
</div>

<div class="main">
  <!-- FORM PANEL -->
  <div class="form-panel">

    <!-- Mold Size -->
    <div class="form-section">
      <div class="section-title">Mold Size</div>
      <div class="field-group">
        <div class="field-row">
          <div class="field">
            <label>OD (inches)</label>
            <input type="number" id="od" step="0.125" min="0" placeholder="6.5" oninput="onInputChange()">
          </div>
          <div class="field">
            <label>ID (inches)</label>
            <input type="number" id="id" step="0.125" min="0" placeholder="4.25" oninput="onInputChange()">
          </div>
          <div class="field">
            <label>Length (inches)</label>
            <input type="number" id="length" step="0.5" min="0" placeholder="8" oninput="onInputChange()">
          </div>
        </div>
      </div>
    </div>

    <!-- Material -->
    <div class="form-section">
      <div class="section-title">Material</div>
      <div class="field">
        <label>Select Material</label>
        <select id="material" onchange="onInputChange()">
          <option value="">-- Choose Material --</option>
          <option value="Virgin PTFE" data-density="0.078">Virgin PTFE</option>
          <option value="15% Glass" data-density="0.080">15% Glass</option>
          <option value="25% Glass" data-density="0.081">25% Glass</option>
          <option value="40% Glass" data-density="0.082">40% Glass</option>
          <option value="15-5 MolyGlass" data-density="0.083">15-5 MolyGlass</option>
          <option value="10% Carbon" data-density="0.078">10% Carbon</option>
          <option value="25% Carbon" data-density="0.075">25% Carbon</option>
          <option value="23% C / 2% G" data-density="0.075">23% C / 2% G</option>
          <option value="40% Bronze" data-density="0.112">40% Bronze</option>
          <option value="55% B / 5% Moly" data-density="0.138">55% B / 5% Moly</option>
          <option value="10% Polyimide" data-density="0.073">10% Polyimide</option>
          <option value="50% Stainless" data-density="0.138">50% Stainless</option>
        </select>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Lbs per Billet (calculated)</label>
        <input type="text" id="lbs_display" readonly placeholder="—">
      </div>
    </div>

    <!-- Press & Pressure -->
    <div class="form-section">
      <div class="section-title">Press & Pressure</div>
      <div class="field-group">
        <div class="field-row2">
          <div class="field">
            <label>Press</label>
            <select id="press" onchange="onInputChange()">
              <option value="">-- Select --</option>
              <option value="Press #1" data-cyl="5" data-area="19.625">Press #1 (5" Cyl.)</option>
              <option value="Press #2" data-cyl="6" data-area="28.26">Press #2 (6" Cyl.)</option>
              <option value="Press #3" data-cyl="8" data-area="50.24">Press #3 (8" Cyl.)</option>
              <option value="Press #4" data-cyl="9" data-area="63.585">Press #4 (9" Cyl.)</option>
              <option value="Press #5" data-cyl="10" data-area="78.5">Press #5 (10" Cyl.)</option>
            </select>
          </div>
          <div class="field">
            <label>Pressure Type</label>
            <select id="pressure_type" onchange="onInputChange()">
              <option value="">-- Select --</option>
              <option value="Virgin PTFE (3,500PSI)" data-psi="3500">Virgin PTFE — 3,500 PSI</option>
              <option value="Filled PTFE (5,000PSI)" data-psi="5000">Filled PTFE — 5,000 PSI</option>
              <option value="Special (7,500PSI)" data-psi="7500">Special — 7,500 PSI</option>
              <option value="Test Billets (10,000PSI)" data-psi="10000">Test Billets — 10,000 PSI</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Total Press Tonnage (calculated, lbs)</label>
          <input type="text" id="pressure_display" readonly placeholder="—">
        </div>
      </div>
    </div>

    <!-- Operator -->
    <div class="form-section">
      <div class="section-title">Job Info</div>
      <div class="field-group">
        <div class="field-row2">
          <div class="field">
            <label>Operator</label>
            <input type="text" id="operator" placeholder="Name" oninput="onInputChange()">
          </div>
          <div class="field">
            <label>Job / Order #</label>
            <input type="text" id="job_num" placeholder="e.g. JO-2847" oninput="onInputChange()">
          </div>
        </div>
        <div class="field-row2">
          <div class="field">
            <label># of Billets Needed</label>
            <input type="number" id="num_billets" min="1" step="1" placeholder="e.g. 10" oninput="onInputChange()">
          </div>
          <div class="field">
            <label>Total Lbs (calculated)</label>
            <input type="text" id="total_lbs_display" readonly placeholder="—">
          </div>
        </div>
        <div class="field">
          <label>Notes</label>
          <input type="text" id="notes" placeholder="Optional notes..." oninput="onInputChange()">
        </div>
      </div>
    </div>

    <button class="generate-btn" onclick="generateTicket()">⚙ Generate Mold Ticket</button>
    <button class="print-btn" onclick="window.print()">🖨 Print Ticket</button>
    <div class="hint" id="validation_hint" style="display:none;"></div>
  </div>

  <!-- TICKET PANEL -->
  <div class="ticket-panel">
    <div class="ticket-wrapper">
      <div class="ticket-label">LIVE PREVIEW</div>
      <div id="ticket-area">
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <div class="empty-text">Fill in the red fields to generate a mold ticket</div>
          <div style="font-size:11px; color:#555; font-family: 'IBM Plex Mono', monospace;">OD · ID · Length · Material · Press · Pressure</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const pressAreas = {
    'Press #1': { cyl: '5"', area: 19.625 },
    'Press #2': { cyl: '6"', area: 28.26 },
    'Press #3': { cyl: '8"', area: 50.24 },
    'Press #4': { cyl: '9"', area: 63.585 },
    'Press #5': { cyl: '10"', area: 78.5 },
  };

  const materialDensity = {
    'Virgin PTFE': 0.078,
    '15% Glass': 0.080,
    '25% Glass': 0.081,
    '40% Glass': 0.082,
    '15-5 MolyGlass': 0.083,
    '10% Carbon': 0.078,
    '25% Carbon': 0.075,
    '23% C / 2% G': 0.075,
    '40% Bronze': 0.112,
    '55% B / 5% Moly': 0.138,
    '10% Polyimide': 0.073,
    '50% Stainless': 0.138,
  };

  const pressureTypes = {
    'Virgin PTFE (3,500PSI)': 3500,
    'Filled PTFE (5,000PSI)': 5000,
    'Special (7,500PSI)': 7500,
    'Test Billets (10,000PSI)': 10000,
  };

  function calcVolume(od, id, len) {
    return ((od * od * 0.785) - (id * id * 0.785)) * len;
  }

  function calcLbs(od, id, len, material) {
    if (!od || !material) return null;
    const density = materialDensity[material];
    if (!density) return null;
    return calcVolume(od, id, len) * density;
  }

  function calcPressure(od, id, pressName, psiType) {
    if (!od || !pressName || !psiType) return null;
    const press = pressAreas[pressName];
    const psi = pressureTypes[psiType];
    if (!press || !psi) return null;
    return calcVolume(od, id, 1) * psi / press.area;
    // Note: pressure is per unit, multiply by length for total? 
    // Looking at the formula: =SUM((A3*A3*0.785)-(B3*B3*0.785))*PSI/cylArea — length NOT factored
  }

  function onInputChange() {
    const od = parseFloat(document.getElementById('od').value) || 0;
    const id = parseFloat(document.getElementById('id').value) || 0;
    const len = parseFloat(document.getElementById('length').value) || 0;
    const mat = document.getElementById('material').value;
    const pressName = document.getElementById('press').value;
    const pressureType = document.getElementById('pressure_type').value;

    // Live lbs calculation
    if (od && len && mat) {
      const lbs = calcLbs(od, id, len, mat);
      document.getElementById('lbs_display').value = lbs ? lbs.toFixed(3) + ' lbs' : '—';
      const numBillets = parseInt(document.getElementById('num_billets').value) || 0;
      if (numBillets && lbs) {
        document.getElementById('total_lbs_display').value = (lbs * numBillets).toFixed(3) + ' lbs';
      } else {
        document.getElementById('total_lbs_display').value = '';
      }
    } else {
      document.getElementById('lbs_display').value = '';
      document.getElementById('total_lbs_display').value = '';
    }

    // Live pressure calc
    if (od && pressName && pressureType) {
      const pres = calcPressure(od, id, pressName, pressureType);
      document.getElementById('pressure_display').value = pres ? pres.toFixed(2) + ' lbs' : '—';
    } else {
      document.getElementById('pressure_display').value = '';
    }
  }

  function generateTicket() {
    const od = parseFloat(document.getElementById('od').value);
    const id = parseFloat(document.getElementById('id').value) || 0;
    const len = parseFloat(document.getElementById('length').value);
    const mat = document.getElementById('material').value;
    const pressName = document.getElementById('press').value;
    const pressureType = document.getElementById('pressure_type').value;
    const operator = document.getElementById('operator').value || '—';
    const jobNum = document.getElementById('job_num').value || '—';
    const numBillets = parseInt(document.getElementById('num_billets').value) || null;
    const notes = document.getElementById('notes').value;
    const hint = document.getElementById('validation_hint');

    const missing = [];
    if (!od) missing.push('OD');
    if (!len) missing.push('Length');
    if (!mat) missing.push('Material');
    if (!pressName) missing.push('Press');
    if (!pressureType) missing.push('Pressure Type');

    if (missing.length) {
      hint.style.display = 'block';
      hint.textContent = '⚠ Missing: ' + missing.join(', ');
      return;
    }
    hint.style.display = 'none';

    const lbs = calcLbs(od, id, len, mat);
    const pressure = calcPressure(od, id, pressName, pressureType);
    const press = pressAreas[pressName];
    const psi = pressureTypes[pressureType];

    // All pressures for table
    const allPressures = Object.entries(pressAreas).map(([name, p]) => {
      return {
        press: name,
        cyl: p.cyl,
        vals: Object.entries(pressureTypes).map(([ptype, psi]) => ({
          type: ptype,
          val: (calcVolume(od, id, 1) * psi / p.area)
        }))
      };
    });

    const now = new Date();
    const ticketId = 'MT-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + Math.floor(Math.random()*9000+1000);
    const dateStr = now.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    const timeStr = now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });

    let pressureTableRows = allPressures.map(p => {
      const isSelected = p.press === pressName;
      const cells = p.vals.map((v, i) => {
        const isSelectedType = Object.keys(pressureTypes)[i] === pressureType;
        const style = (isSelected && isSelectedType) ? 'style="background:#fde8e8;font-weight:700;color:#991111;"' : '';
        return `<td ${style}>${v.val.toFixed(0)} lbs</td>`;
      }).join('');
      const rowClass = isSelected ? 'class="highlighted"' : '';
      return `<tr ${rowClass}><td><strong>${p.press}</strong></td><td>${p.cyl} Cyl.</td>${cells}</tr>`;
    }).join('');

    document.getElementById('ticket-area').innerHTML = `
      <div class="ticket">
        <div class="ticket-header">
          <div>
            <div class="ticket-company">Polytech</div>
            <div class="ticket-subtitle">PTFE Molding Operations</div>
          </div>
          <div class="ticket-id-block">
            <div class="ticket-id-label">Ticket ID</div>
            <div class="ticket-id">${ticketId}</div>
            <div class="ticket-date">${dateStr} · ${timeStr}</div>
          </div>
        </div>
        <div class="ticket-banner">Mold Production Ticket</div>

        <div class="ticket-body">

          <!-- Mold Size -->
          <div>
            <div class="ticket-section-header">Mold Dimensions</div>
            <div class="ticket-grid3">
              <div class="t-field">
                <label>Outer Diameter</label>
                <div class="t-value">${od}" OD</div>
              </div>
              <div class="t-field">
                <label>Inner Diameter</label>
                <div class="t-value">${id > 0 ? id + '" ID' : '— (Solid Rod)'}</div>
              </div>
              <div class="t-field">
                <label>Billet Length</label>
                <div class="t-value">${len}"</div>
              </div>
            </div>
          </div>

          <!-- Material + Weight -->
          <div>
            <div class="ticket-section-header">Material & Weight</div>
            <div class="ticket-material-block">
              <div class="material-name">${mat}</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;">
                <div>
                  <div class="material-weight">
                    <div class="material-weight-num">${lbs.toFixed(3)}</div>
                    <div class="material-weight-unit">lbs</div>
                  </div>
                  <div class="material-weight-label">Lbs per billet</div>
                </div>
                ${numBillets ? `<div>
                  <div class="material-weight">
                    <div class="material-weight-num">${(lbs * numBillets).toFixed(3)}</div>
                    <div class="material-weight-unit">lbs</div>
                  </div>
                  <div class="material-weight-label">Total lbs (${numBillets} billets)</div>
                </div>` : ''}
              </div>
            </div>
          </div>

          <!-- Press & Pressure -->
          <div>
            <div class="ticket-section-header">Press Pressure Requirements</div>
            <div class="ticket-grid2" style="margin-bottom:12px;">
              <div class="t-field">
                <label>Press Selected</label>
                <div class="t-value highlight">${pressName} — ${press.cyl} Cyl.</div>
              </div>
              <div class="t-field">
                <label>Pressure Type</label>
                <div class="t-value highlight">${pressureType}</div>
              </div>
            </div>
            <div class="t-field" style="margin-bottom:14px;">
              <label>Required Total Press Force</label>
              <div class="t-value green" style="font-size:22px;">${pressure.toFixed(0)} lbs &nbsp;·&nbsp; ${(pressure/2000).toFixed(2)} tons</div>
            </div>
            <table class="pressure-table">
              <thead>
                <tr>
                  <th>Press</th>
                  <th>Cylinder</th>
                  <th>3,500 PSI</th>
                  <th>5,000 PSI</th>
                  <th>7,500 PSI</th>
                  <th>10,000 PSI</th>
                </tr>
              </thead>
              <tbody>
                ${pressureTableRows}
              </tbody>
            </table>
          </div>

          <!-- Job Info -->
          <div>
            <div class="ticket-section-header">Job Information</div>
            <div class="ticket-grid2">
              <div class="t-field">
                <label>Operator</label>
                <div class="t-value">${operator}</div>
              </div>
              <div class="t-field">
                <label>Job / Order #</label>
                <div class="t-value">${jobNum}</div>
              </div>
              <div class="t-field">
                <label>Billets Needed</label>
                <div class="t-value${numBillets ? ' highlight' : ''}">${numBillets ? numBillets + ' billets' : '—'}</div>
              </div>
              ${numBillets ? `<div class="t-field"><label>Total Material Required</label><div class="t-value green">${(lbs * numBillets).toFixed(3)} lbs</div></div>` : ''}
              ${notes ? `<div class="t-field" style="grid-column:1/-1;"><label>Notes</label><div class="t-value">${notes}</div></div>` : ''}
            </div>
          </div>

        </div>

        <div class="ticket-footer">
          <div class="footer-op">Generated: ${dateStr}</div>
          <div class="footer-sig">
            <div class="sig-line">
              <div class="sig-underline"></div>
              <div class="sig-label">Press Operator</div>
            </div>
            <div class="sig-line">
              <div class="sig-underline"></div>
              <div class="sig-label">QC Approval</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // Auto-generate if all fields filled
  document.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('change', () => {
      const od = document.getElementById('od').value;
      const len = document.getElementById('length').value;
      const mat = document.getElementById('material').value;
      const press = document.getElementById('press').value;
      const pt = document.getElementById('pressure_type').value;
      if (od && len && mat && press && pt) generateTicket();
    });
  });
</script>
</body>
</html>
